org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Gradle daemon JDK.
# Registered IVI middleware baseline is JDK 17 and the compile toolchain is fixed to 17
# (jvmToolchain(17) in every module). The daemon must NOT run on JDK 25: Kotlin 2.0.21 ships an
# embedded IntelliJ JavaVersion parser that fails on "25.0.2" (IllegalArgumentException: 25.0.2),
# which breaks Android Studio sync when the Gradle JDK resolves to the bundled JBR 25.
# Pinning the daemon JVM here keeps CLI and IDE builds on a supported JDK regardless of JAVA_HOME
# or the IDE Gradle JDK setting. Replace the path with any JDK 17 (>=17.0.2) or JDK 21 install on
# another machine, or delete the line to use JAVA_HOME.
org.gradle.java.home=/Users/hwyz_leo/Library/Java/JavaVirtualMachines/amazon-corretto-17.jdk/Contents/Home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
